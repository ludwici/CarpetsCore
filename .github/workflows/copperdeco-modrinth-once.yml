name: One-time Copper Deco Modrinth release

on:
  push:
    branches:
      - '26.2'
    paths:
      - '.github/COPPERDECO_MODRINTH_RELEASE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modrinth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ludwici/CopperDeco
          ref: 1af5c925dfbde816c2a8675e7eb004f6366fded7
          path: copperdeco
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Copper Deco
        working-directory: copperdeco
        run: |
          chmod +x gradlew
          ./gradlew runData --no-daemon --stacktrace
          ./gradlew clean build --no-daemon --stacktrace
      - name: Resolve or create Copper Deco Modrinth project
        id: modrinth
        working-directory: copperdeco
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          test -n "$MODRINTH_TOKEN" || { echo "Missing MODRINTH_TOKEN"; exit 1; }
          python3 .github/scripts/resolve_modrinth_project.py
      - name: Publish Copper Deco on Modrinth
        working-directory: copperdeco
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishModrinth -PmodrinthProjectId=${{ steps.modrinth.outputs.project_id }} --no-daemon --stacktrace
