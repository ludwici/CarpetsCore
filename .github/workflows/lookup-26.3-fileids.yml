name: Lookup new CarpetsCore CurseForge file IDs

on:
  push:
    branches: ['1.21.3']
    paths:
      - '.github/workflows/lookup-26.3-fileids.yml'

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Query recently published files without exposing tokens
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          project_id = 1140721
          endpoints = [
              ("curse-tools", f"https://api.curse.tools/v1/cf/mods/{project_id}/files?pageSize=50", {}),
              ("curseforge-api", f"https://api.curseforge.com/v1/mods/{project_id}/files?pageSize=50", {"x-api-key": os.environ.get("CURSEFORGE_TOKEN", "")}),
              ("curseforge-website", "https://www.curseforge.com/minecraft/mc-mods/carpets-core/files/all", {"User-Agent": "Mozilla/5.0"}),
          ]
          for name, url, headers in endpoints:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=25) as response:
                      raw = response.read()
                      print(f"{name}: status={response.status}, body_length={len(raw)}")
                  if name == "curseforge-website":
                      for filename in ["carpetscore-fabric-26.3-1.3.1.jar", "carpetscore-neo-26.3-1.3.1.jar"]:
                          print(f"{name}: {filename}: visible={filename.encode() in raw}")
                      continue
                  value = json.loads(raw)
                  records = value.get("data", value) if isinstance(value, dict) else value
                  if not isinstance(records, list):
                      print(f"{name}: unexpected response data type")
                      continue
                  print(f"{name}: returned={len(records)}")
                  for item in records:
                      filename = item.get("fileName", "")
                      if ("carpetscore" in filename.lower() and ("26.3" in filename or "26.2" in filename)):
                          print(f"{name}: FILE_ID={item.get('id')} NAME={filename} STATUS={item.get('fileStatus')} AVAILABLE={item.get('isAvailable')}")
              except urllib.error.HTTPError as error:
                  print(f"{name}: HTTP {error.code}")
              except Exception as error:
                  print(f"{name}: error {type(error).__name__}: {str(error)[:160]}")
          PY
