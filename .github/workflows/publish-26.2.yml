name: Publish Carpets Core 26.2

on:
  workflow_dispatch:
  push:
    branches:
      - '26.2'
    paths:
      - '.github/RELEASE_26_2'

permissions:
  contents: read

concurrency:
  group: carpetscore-publish-26.2
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.loader }} to CurseForge and Modrinth
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release
        working-directory: ${{ matrix.loader }}
        run: bash ./gradlew clean build --no-daemon --stacktrace
      - name: Publish to CurseForge and Modrinth
        working-directory: ${{ matrix.loader }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          test -n "$CURSEFORGE_TOKEN" || { echo 'Missing CURSEFORGE_TOKEN'; exit 1; }
          test -n "$MODRINTH_TOKEN" || { echo 'Missing MODRINTH_TOKEN'; exit 1; }
          bash ./gradlew publishMods --no-daemon --stacktrace
