name: Compatibility 26.1.x

on:
  push:
    branches: ['26.1.2']
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    name: ${{ matrix.loader }} / ${{ matrix.minecraft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            minecraft: '26.1'
            fabric_api: '0.145.1+26.1'
          - loader: fabric
            minecraft: '26.1.1'
            fabric_api: '0.145.2+26.1.1'
          - loader: neoforge
            minecraft: '26.1'
            neoforge: '26.1.0.8-beta'
          - loader: neoforge
            minecraft: '26.1.1'
            neoforge: '26.1.1.0-beta'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Fabric against Minecraft ${{ matrix.minecraft }}
        if: matrix.loader == 'fabric'
        working-directory: fabric
        run: bash ./gradlew build -Pminecraft_version='${{ matrix.minecraft }}' -Pfabric_api_version='${{ matrix.fabric_api }}' --no-daemon
      - name: Compile NeoForge against Minecraft ${{ matrix.minecraft }}
        if: matrix.loader == 'neoforge'
        working-directory: neoforge
        run: bash ./gradlew build -Pminecraft_version='${{ matrix.minecraft }}' -Pneo_version='${{ matrix.neoforge }}' --no-daemon
