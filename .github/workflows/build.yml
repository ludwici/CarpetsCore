name: Build

on:
  push:
    branches:
      - '26.1.2'
      - '26.2'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: ${{ matrix.loader }}
        run: bash ./gradlew build --no-daemon
