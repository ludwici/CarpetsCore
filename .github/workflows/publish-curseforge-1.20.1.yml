name: Publish Carpets Core 1.20.1 to CurseForge

on:
  workflow_dispatch:
  push:
    branches:
      - '1.20.1'
    paths:
      - '.github/RELEASE_CARPETS_1201'

permissions:
  contents: read

concurrency:
  group: carpetscore-1.20.1-1.1.0-curseforge
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Carpets Core 1.20.1 ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, fabric]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release
        run: |
          chmod +x ./gradlew
          ./gradlew :${{ matrix.loader }}:build --no-daemon --stacktrace
      - name: Verify publish configuration (dry run)
        env:
          CURSEFORGE_TOKEN: dry-run-only
        run: ./gradlew :${{ matrix.loader }}:publishCurseforge -PpublishDryRun=true --no-daemon --stacktrace
      - name: Upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_TOKEN" || { echo 'Missing CURSEFORGE_TOKEN'; exit 1; }
          ./gradlew :${{ matrix.loader }}:publishCurseforge --no-daemon --stacktrace
