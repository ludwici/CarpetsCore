name: Publish Carpets Core 1.20.1 to CurseForge and Modrinth

on:
  workflow_dispatch:
  push:
    branches: ['1.20.1']
    paths:
      - '.github/workflows/publish-curseforge-1.20.1.yml'

permissions:
  contents: read

concurrency:
  group: carpetscore-1.20.1-1.1.0-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish]')
    name: Publish Carpets Core 1.20.1 ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: forge
            java: '17'
          - loader: fabric
            java: '21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Check publishing tokens
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          test -n "$CURSEFORGE_TOKEN" || { echo 'Missing CURSEFORGE_TOKEN'; exit 1; }
          test -n "$MODRINTH_TOKEN" || { echo 'Missing MODRINTH_TOKEN'; exit 1; }
      - name: Build release
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew :${{ matrix.loader }}:build -PbuildLoader=${{ matrix.loader }} --no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Gradle build attempt $attempt failed; retrying"
            sleep 15
          done
      - name: Verify release JAR
        env:
          LOADER: ${{ matrix.loader }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          loader = os.environ["LOADER"]
          jar = Path(loader) / "build" / "libs" / f"carpetscore-{loader}-1.20.1-1.1.0.jar"
          assert jar.is_file(), f"Release JAR not found: {jar}"
          with ZipFile(jar) as archive:
              files = set(archive.namelist())
              assert "com/ludwici/carpetscore/api/block/NoGravityVariantBlock.class" in files
              if loader == "forge":
                  metadata = archive.read("META-INF/mods.toml").decode()
                  assert 'version = "1.1.0"' in metadata or 'version="1.1.0"' in metadata
              else:
                  metadata = json.loads(archive.read("fabric.mod.json"))
                  assert metadata["version"] == "1.1.0"
          print(f"Verified {jar}")
          PY
      - name: Publish to CurseForge and Modrinth
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew :${{ matrix.loader }}:publishMods -PbuildLoader=${{ matrix.loader }} --no-daemon --stacktrace
