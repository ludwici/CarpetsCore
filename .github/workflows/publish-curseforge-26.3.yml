name: Publish Carpets Core 26.3 to CurseForge

on:
  workflow_dispatch:
  push:
    branches:
      - '26.3'
    paths:
      - '.github/CURSEFORGE_26_3_RELEASE'

permissions:
  contents: read

concurrency:
  group: carpetscore-26.3-curseforge
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.loader }} (Minecraft 26.3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JAR
        working-directory: ${{ matrix.loader }}
        run: bash ./gradlew clean build --no-daemon --stacktrace
      - name: Verify token
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: test -n "$CURSEFORGE_TOKEN" || { echo 'CURSEFORGE_TOKEN missing'; exit 1; }
      - name: Upload to CurseForge
        working-directory: ${{ matrix.loader }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: bash ./gradlew publishCurseforge --no-daemon --stacktrace
