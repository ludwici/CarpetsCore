pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'CarpetsCore'
include('common')

def buildLoader = providers.gradleProperty('buildLoader').orNull
if (buildLoader == null) {
    include('fabric')
    include('forge')
} else if (buildLoader == 'fabric' || buildLoader == 'forge') {
    include(buildLoader)
} else {
    throw new GradleException("Unsupported buildLoader: ${buildLoader}")
}